name: Build and Push Agent Browser Images

# Browser images (base + chromium/chrome/brave) are slow to build and
# change far less often than the instance image. Split out from the old
# combined agent.yml on 2026-08-24 so instance iteration (agent-instance.yml)
# never waits on this, and this pipeline only runs when browser files
# actually change or is triggered manually / on schedule.
on:
  push:
    branches: [main]
    paths:
      - 'agent/browser/**'
      - 'agent/tests/**'
      - 'Makefile'
      - '.github/workflows/agent-browser.yml'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  agent-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install test dependencies
        run: make install-test

      # FORK-ONLY: image names overridden to the shaunbarlow Docker Hub
      # namespace (make command-line overrides beat the Makefile's `:=`
      # assignments). Drop this commit before PRing upstream.
      - name: Build browser-base image
        run: |
          make agent-base \
            BROWSER_BASE_IMAGE=shaunbarlow/base-browser
        env:
          CACHE_ARGS: --cache-from type=gha,scope=agent-base --cache-to type=gha,mode=max,scope=agent-base

      - name: Build chromium browser image (local)
        run: |
          make agent-build-chromium \
            BROWSER_BASE_IMAGE=shaunbarlow/base-browser \
            BROWSER_CHROMIUM_IMAGE=shaunbarlow/chromium-browser
        env:
          CACHE_ARGS: --cache-from type=gha,scope=agent-chromium --cache-to type=gha,mode=max,scope=agent-chromium

      - name: Build chrome browser image (local)
        run: |
          make agent-build-chrome \
            BROWSER_BASE_IMAGE=shaunbarlow/base-browser \
            BROWSER_CHROME_IMAGE=shaunbarlow/chrome-browser
        env:
          CACHE_ARGS: --cache-from type=gha,scope=agent-chrome --cache-to type=gha,mode=max,scope=agent-chrome

      - name: Build brave browser image (local)
        run: |
          make agent-build-brave \
            BROWSER_BASE_IMAGE=shaunbarlow/base-browser \
            BROWSER_BRAVE_IMAGE=shaunbarlow/brave-browser
        env:
          CACHE_ARGS: --cache-from type=gha,scope=agent-brave --cache-to type=gha,mode=max,scope=agent-brave

      # Browser-only test run — no instance container is launched, so the
      # openclaw/cron/env-var suites skip themselves and this only
      # exercises browser.test.ts (CDP + browser process checks) against
      # the three browser images.
      - name: Run agent browser test suite
        run: |
          make agent-test-browser \
            BROWSER_CHROMIUM_IMAGE=shaunbarlow/chromium-browser \
            BROWSER_CHROME_IMAGE=shaunbarlow/chrome-browser \
            BROWSER_BRAVE_IMAGE=shaunbarlow/brave-browser

      - name: Push chromium browser image
        run: |
          make agent-push-chromium \
            BROWSER_BASE_IMAGE=shaunbarlow/base-browser \
            BROWSER_CHROMIUM_IMAGE=shaunbarlow/chromium-browser
        env:
          CACHE_ARGS: --cache-from type=gha,scope=agent-chromium --cache-to type=gha,mode=max,scope=agent-chromium

      - name: Push chrome browser image
        run: |
          make agent-push-chrome \
            BROWSER_BASE_IMAGE=shaunbarlow/base-browser \
            BROWSER_CHROME_IMAGE=shaunbarlow/chrome-browser
        env:
          CACHE_ARGS: --cache-from type=gha,scope=agent-chrome --cache-to type=gha,mode=max,scope=agent-chrome

      - name: Push brave browser image
        run: |
          make agent-push-brave \
            BROWSER_BASE_IMAGE=shaunbarlow/base-browser \
            BROWSER_BRAVE_IMAGE=shaunbarlow/brave-browser
        env:
          CACHE_ARGS: --cache-from type=gha,scope=agent-brave --cache-to type=gha,mode=max,scope=agent-brave
