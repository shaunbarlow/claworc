name: Build and Push Agent Image

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - '.github/workflows/agent.yml'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install test dependencies
        run: make install-test

      # FORK-ONLY: image names overridden to the shaunbarlow Docker Hub
      # namespace (make command-line overrides beat the Makefile's `:=`
      # assignments). Drop this commit before PRing upstream.
      #
      # 2026-08-24: split the former single "Build, test, and push agent
      # images" step (make agent-ci) into one step per image so a failure
      # or slow step is attributable at a glance in the Actions log,
      # instead of scrolling one giant interleaved/parallel blob.
      - name: Build browser-base image
        run: |
          make agent-base \
            BROWSER_BASE_IMAGE=shaunbarlow/base-browser
        env:
          CACHE_ARGS: --cache-from type=gha,scope=agent-base --cache-to type=gha,mode=max,scope=agent-base

      - name: Build agent instance image (local)
        run: |
          make agent-build-instance \
            AGENT_IMAGE=shaunbarlow/openclaw
        env:
          CACHE_ARGS: --cache-from type=gha,scope=agent-instance --cache-to type=gha,mode=max,scope=agent-instance

      - name: Build chromium browser image (local)
        run: |
          make agent-build-chromium \
            BROWSER_BASE_IMAGE=shaunbarlow/base-browser \
            BROWSER_CHROMIUM_IMAGE=shaunbarlow/chromium-browser
        env:
          CACHE_ARGS: --cache-from type=gha,scope=agent-chromium --cache-to type=gha,mode=max,scope=agent-chromium

      - name: Build chrome browser image (local)
        run: |
          make agent-build-chrome \
            BROWSER_BASE_IMAGE=shaunbarlow/base-browser \
            BROWSER_CHROME_IMAGE=shaunbarlow/chrome-browser
        env:
          CACHE_ARGS: --cache-from type=gha,scope=agent-chrome --cache-to type=gha,mode=max,scope=agent-chrome

      - name: Build brave browser image (local)
        run: |
          make agent-build-brave \
            BROWSER_BASE_IMAGE=shaunbarlow/base-browser \
            BROWSER_BRAVE_IMAGE=shaunbarlow/brave-browser
        env:
          CACHE_ARGS: --cache-from type=gha,scope=agent-brave --cache-to type=gha,mode=max,scope=agent-brave

      - name: Run agent test suite
        run: |
          make agent-test \
            AGENT_IMAGE=shaunbarlow/openclaw \
            BROWSER_CHROMIUM_IMAGE=shaunbarlow/chromium-browser \
            BROWSER_CHROME_IMAGE=shaunbarlow/chrome-browser \
            BROWSER_BRAVE_IMAGE=shaunbarlow/brave-browser

      - name: Push agent instance image
        run: |
          make agent-push-instance \
            AGENT_IMAGE=shaunbarlow/openclaw
        env:
          CACHE_ARGS: --cache-from type=gha,scope=agent-instance --cache-to type=gha,mode=max,scope=agent-instance

      - name: Push chromium browser image
        run: |
          make agent-push-chromium \
            BROWSER_BASE_IMAGE=shaunbarlow/base-browser \
            BROWSER_CHROMIUM_IMAGE=shaunbarlow/chromium-browser
        env:
          CACHE_ARGS: --cache-from type=gha,scope=agent-chromium --cache-to type=gha,mode=max,scope=agent-chromium

      - name: Push chrome browser image
        run: |
          make agent-push-chrome \
            BROWSER_BASE_IMAGE=shaunbarlow/base-browser \
            BROWSER_CHROME_IMAGE=shaunbarlow/chrome-browser
        env:
          CACHE_ARGS: --cache-from type=gha,scope=agent-chrome --cache-to type=gha,mode=max,scope=agent-chrome

      - name: Push brave browser image
        run: |
          make agent-push-brave \
            BROWSER_BASE_IMAGE=shaunbarlow/base-browser \
            BROWSER_BRAVE_IMAGE=shaunbarlow/brave-browser
        env:
          CACHE_ARGS: --cache-from type=gha,scope=agent-brave --cache-to type=gha,mode=max,scope=agent-brave

      # Stable image build path disabled 2026-08-24 at Shaun's request
      # (low visibility while we work through image-splitting above; also
      # avoids double-building/pushing while we validate the new steps).
      # Re-enable by uncommenting once the split above is confirmed good.
      # - name: Build, test, and push stable agent image
      #   run: |
      #     make agent-stable-ci \
      #       STABLE_IMAGE=shaunbarlow/claworc-stable \
      #       STABLE_MIRROR_IMAGE=shaunbarlow/openclaw-stable
      #   env:
      #     CACHE_ARGS: --cache-from type=gha,scope=agent-stable --cache-to type=gha,mode=max,scope=agent-stable
